<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2a"><title>LAN Bounty Mobile</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>⭐ BOUNTY ARENA</strong><small> Colt-style • six bullets per shot</small></div><span id="status">Connecting…</span></header>
<section class="hud"><span>⏱ <b id="timer">3:00</b></span><span>🏆 Score <b id="score">0</b>/20</span><span>⭐ Bounty <b id="bounty">0</b>/7</span></section>
<main><canvas id="game" width="1000" height="650" aria-label="Game arena"></canvas></main>
<section class="player-bars"><div class="bar-labels"><span>HEALTH <b id="hpText">6200 / 6200</b></span><span>AMMO <b id="ammoText">3 / 3</b></span></div><div class="health-track"><div id="healthBar" class="health-fill"></div></div><div class="ammo-track"><i id="ammo0"></i><i id="ammo1"></i><i id="ammo2"></i></div><div id="healHint">Regeneration starts after 3 seconds without attacking or taking damage.</div></section>
<div class="tips">LEFT: move · RIGHT: aim · FIRE: shoot · First to 20 score wins</div><section class="controls" aria-label="Touch controls"><div class="joystick-area" id="joyArea"><div class="joy-base"><div class="joy-knob" id="joyKnob"></div></div><span class="control-label">MOVE</span></div><div class="aim-area" id="aimArea"><div class="aim-ring">AIM</div><button id="fire" aria-label="Fire">FIRE</button></div></section>
<div id="overlay" class="overlay hidden"><div class="card"><h1 id="endTitle">MATCH OVER!</h1><p id="winner"></p><button id="again">Play again</button></div></div><script src="client.js"></script></body></html>
